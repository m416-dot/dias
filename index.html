<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Custo em Vida</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 400px;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .resultado {
      margin-top: 20px;
      padding: 15px;
      background: #f0f8ff;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
    }

    .detalhes {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Quanto isso custa da sua vida?</h2>

  <label>Salário mensal:</label>
  <input type="number" id="salario" step="0.01" placeholder="Ex: 1621,00">

  <label>Dias trabalhados no mês:</label>
  <input type="number" id="dias" placeholder="Ex: 22">

  <label>Custo do produto / gasto:</label>
  <input type="number" id="custo" step="0.01" placeholder="Ex: 500,00">

  <button onclick="calcular()">Calcular</button>

  <div class="resultado" id="resultado"></div>
  <div class="detalhes" id="detalhes"></div>
</div>

<script>
  function calcular() {
    const salario = parseFloat(document.getElementById('salario').value);
    const diasTrabalhados = parseFloat(document.getElementById('dias').value);
    const custo = parseFloat(document.getElementById('custo').value);

    if (!salario || !diasTrabalhados || !custo) {
      alert("Preencha todos os campos corretamente.");
      return;
    }

    const valorPorDia = salario / diasTrabalhados;
    const valorPorHora = valorPorDia / 8;

    const totalHoras = custo / valorPorHora;

    const dias = Math.floor(totalHoras / 8);
    const horas = Math.round(totalHoras % 8);

    document.getElementById('resultado').innerText =
      `Esse gasto custa ${dias} dias e ${horas} horas.`;

    document.getElementById('detalhes').innerText =
      `Valor por dia: R$ ${valorPorDia.toFixed(2)} | Valor por hora: R$ ${valorPorHora.toFixed(2)}`;
  }
</script>

</body>
</html>
