<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10251f">
  <meta name="description" content="A contagem regressiva da viagem de Vitório e Vitória para a Cabana.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nossa Cabana">
  <title>Vitório & Vitória — Nossa Cabana</title>
  <style>
    :root { color-scheme: dark; --cream:#f6f0e4; --muted:#c5d0c7; --gold:#e8c58b; --glass:rgba(9,25,21,.62); }
    * { box-sizing:border-box; }
    html { min-height:100%; background:#10251f; }
    body { margin:0; min-height:100svh; font-family: ui-rounded, "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--cream); background:#10251f; }
    .scene { position:fixed; inset:0; overflow:hidden; background:
      radial-gradient(ellipse at 78% 18%, rgba(232,197,139,.34), transparent 22%),
      linear-gradient(180deg,#253e3a 0%,#52675c 35%,#b18460 65%,#172d27 100%); }
    .scene:before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(7,20,17,.08),rgba(7,20,17,.38) 54%,rgba(7,20,17,.86)); }
    .moon { position:absolute; width:74px;height:74px;border-radius:50%;background:#f4d9a7;right:17%;top:13%;box-shadow:0 0 55px rgba(244,217,167,.38); }
    .mountains { position:absolute; left:0;right:0;bottom:20%;width:100%;height:54%; }
    .tree-line { position:absolute; left:-4%;right:-4%;bottom:13%;height:36%; opacity:.8; background:#1c3830; clip-path:polygon(0 70%,4% 44%,7% 65%,11% 28%,15% 66%,20% 10%,25% 66%,30% 35%,35% 70%,40% 15%,45% 67%,51% 28%,56% 72%,61% 16%,66% 64%,71% 34%,76% 69%,81% 12%,86% 64%,91% 30%,96% 65%,100% 40%,100% 100%,0 100%); }
    .ground { position:absolute;left:-10%;right:-10%;bottom:-8%;height:34%;border-radius:50% 50% 0 0;background:linear-gradient(155deg,#29473a,#10251f 75%); }
    .wrap { position:relative; z-index:1; width:min(100%,560px); min-height:100svh; margin:auto; padding: max(28px, env(safe-area-inset-top)) 22px max(26px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; justify-content:space-between; gap:24px; }
    header { text-align:center; padding-top:8px; }
    .eyebrow { display:inline-flex;align-items:center;gap:8px;letter-spacing:.2em;text-transform:uppercase;font-size:10px;font-weight:700;color:#f0d7ac; }
    .eyebrow:before,.eyebrow:after { content:"";width:22px;height:1px;background:currentColor;opacity:.7; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight:400; font-size:clamp(35px,9vw,49px); line-height:1.08; margin:15px 0 8px; letter-spacing:-.04em; text-shadow:0 2px 25px #172d27; }
    h1 span { color:#f0d09b; font-style:italic; }
    .subtitle { color:#f1e6d3; font-size:14px; letter-spacing:.03em; margin:0; }
    .center { text-align:center; margin-top:auto; margin-bottom:auto; }
    .trip-label { display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(246,240,228,.28);background:rgba(12,31,25,.32);padding:9px 14px;border-radius:999px;color:#f6e5c7;font-size:12px;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(8px); }
    .count-card { margin:22px 0 0; padding:25px 16px 21px; border:1px solid rgba(255,255,255,.17); border-radius:25px; background:var(--glass); backdrop-filter:blur(16px); box-shadow:0 20px 60px rgba(0,0,0,.18); }
    .count-title { font-family:Georgia,serif;font-size:21px;font-weight:400;margin:0 0 21px;color:#fff8ed; }
    .countdown { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px; }
    .unit { min-width:0; }
    .number { font-size:clamp(28px,7.5vw,43px);font-weight:650;line-height:1.05;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:#fff8ed; }
    .unit-label { margin-top:9px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#d0d9cf; }
    .date { margin:23px 0 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);font-size:13px;color:#ead7b6;letter-spacing:.04em; }
    .date strong { color:#fff5e5;font-weight:600; }
    .message { max-width:330px;margin:21px auto 0;font-family:Georgia,serif;font-style:italic;font-size:clamp(19px,5vw,23px);line-height:1.4;color:#fff0d8; }
    .heart { display:block;margin:10px auto 0;color:#edc68f;font-size:17px; }
    footer { text-align:center;color:rgba(245,239,225,.7);font-size:11px;letter-spacing:.06em; }
    .tiny-heart { color:#e8c58b; }
    @media (min-height:800px) { .wrap { padding-top:max(38px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom)); } .count-card { padding:29px 19px 23px; } }
    @media (max-width:360px) { .wrap {padding-left:15px;padding-right:15px;} .countdown{gap:3px;} .unit-label{font-size:9px;} }
    @media (prefers-reduced-motion:no-preference) { .moon { animation: glow 5s ease-in-out infinite alternate; } @keyframes glow { from {box-shadow:0 0 35px rgba(244,217,167,.25)} to {box-shadow:0 0 70px rgba(244,217,167,.5)} } }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="moon"></div>
    <svg class="mountains" viewBox="0 0 800 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 350 L135 145 L220 260 L340 80 L510 300 L610 160 L800 360 L800 500 L0 500Z" fill="#344d43" opacity=".82"/>
      <path d="M230 230 L340 80 L430 205 L380 180 L345 205 L316 164 L282 230Z" fill="#e1c8a3" opacity=".45"/>
      <path d="M0 395 L170 250 L300 365 L465 205 L650 380 L740 280 L800 340 L800 500 L0 500Z" fill="#213d33"/>
      <path d="M0 435 Q150 360 290 425 T570 410 T800 400 L800 500 L0 500Z" fill="#172f27"/>
    </svg>
    <div class="tree-line"></div><div class="ground"></div>
  </div>
  <main class="wrap">
    <header>
      <div class="eyebrow">Nossa próxima aventura</div>
      <h1>Vitório <span>&</span><br>Vitória</h1>
      <p class="subtitle">um destino, duas mochilas e mil histórias</p>
    </header>
    <section class="center" aria-label="Contagem regressiva para a viagem">
      <div class="trip-label">⌁ &nbsp; Destino: Cabana</div>
      <div class="count-card">
        <p class="count-title">A aventura começa em…</p>
        <div class="countdown" aria-live="polite">
          <div class="unit"><div class="number" id="days">--</div><div class="unit-label">Dias</div></div>
          <div class="unit"><div class="number" id="hours">--</div><div class="unit-label">Horas</div></div>
          <div class="unit"><div class="number" id="minutes">--</div><div class="unit-label">Minutos</div></div>
          <div class="unit"><div class="number" id="seconds">--</div><div class="unit-label">Segundos</div></div>
        </div>
        <p class="date">✦ &nbsp; <strong>20 de novembro de 2026</strong></p>
      </div>
      <p class="message">“Para os ansiosos ficarem ainda mais ansiosos.”</p>
      <span class="heart" aria-hidden="true">♥</span>
    </section>
    <footer>FEITO COM CARINHO POR VITÓRIO & VITÓRIA <span class="tiny-heart">♥</span></footer>
  </main>
  <script>
    // Contagem até o início de 20/11/2026 no horário de Fortaleza (UTC−3).
    const target = new Date("2026-11-20T00:00:00-03:00").getTime();
    const ids = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };
    function updateCountdown() {
      let remaining = Math.max(0, target - Date.now());
      const day = 86400000, hour = 3600000, minute = 60000;
      const values = {
        days: Math.floor(remaining / day),
        hours: Math.floor((remaining % day) / hour),
        minutes: Math.floor((remaining % hour) / minute),
        seconds: Math.floor((remaining % minute) / 1000)
      };
      for (const key of Object.keys(ids)) ids[key].textContent = String(values[key]).padStart(2, "0");
      if (remaining <= 0) {
        document.querySelector(".count-title").textContent = "Chegou o dia da nossa aventura!";
      }
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
